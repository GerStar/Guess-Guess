<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Guess-Guess - Juego de Charadas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; user-select: none; -webkit-user-select: none; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="h-full bg-slate-950 text-white overflow-x-hidden flex justify-center items-center">

    <div id="app" class="w-full max-w-md h-full md:h-[90vh] md:rounded-3xl md:border-4 md:border-slate-800 bg-slate-900 flex flex-col shadow-2xl overflow-hidden relative">
        <!-- Rendered dynamically -->
    </div>

    <script>
        const MOVIES_DB = [
            "El Padrino", "Titanic", "Avatar", "Star Wars: Una Nueva Esperanza", "El Señor de los Anillos: La Comunidad del Anillo",
            "Jurassic Park", "Forrest Gump", "Volver al Futuro", "Matrix", "Pulp Fiction",
            "El Rey León", "Gladiador", "Buscando a Nemo", "Toy Story", "Spider-Man",
            "Batman: El Caballero de la Noche", "Avengers: Los Vengadores", "Harry Potter y la Piedra Filosofal", "Inception", "Interstellar",
            "Coco", "Intensa-Mente", "Up: Una Aventura de Altura", "Shrek", "Monsters, Inc.",
            "Los Increíbles", "Ratatouille", "WALL-E", "Buscando a Dory", "Cars",
            "Frozen: Una Aventura Congelada", "Moana: Un Mar de Aventuras", "Enredados", "La Bella y la Bestia", "Aladdín",
            "Mulan", "Pocahontas", "Tarzán", "Hércules",
            "El Extraño Mundo de Jack", "Bichos", "Madagascar", "La Era de Hielo", "Kung Fu Panda",
            "Cómo Entrenar a tu Dragón", "Mi Villano Favorito", "Los Minions", "Hotel Transylvania", "Lluvia de Hamburguesas",
            "Los Juegos del Hambre", "Crepúsculo", "Divergente", "Maze Runner: Correr o Morir", "Percy Jackson y el Ladrón del Rayo",
            "Las Crónicas de Narnia: El León, la Bruja y el Ropero", "Alicia en el País de las Maravillas", "Charlie y la Fábrica de Chocolates", "Jumanji", "La Momia",
            "Piratas del Caribe: La Maldición del Perla Negra", "Indiana Jones y los Cazadores del Arca Perdida", "Volver al Futuro Parte II", "Volver al Futuro Parte III", "Terminator",
            "Terminator 2: El Juicio Final", "Depredador", "Alien: El Octavo Pasajero", "Duro de Matar", "Duro de Matar 3",
            "Rápido y Furioso", "Rápidos y Furiosos: Reto Tokio", "Misión Imposible", "Misión Imposible: Repercusión", "007: Operación Skyfall",
            "John Wick", "Búsqueda Implacable", "Troya", "300",
            "El Señor de los Anillos: Las Dos Torres", "El Señor de los Anillos: El Retorno del Rey", "El Hobbit: Un Viaje Inesperado", "El Hobbit: La Desolación de Smaug", "El Hobbit: La Batalla de los Cinco Ejércitos",
            "Doctor Strange: Hechicero Supremo", "Capitán América: El Primer Vengador", "Iron Man", "Thor", "Pantera Negra",
            "Guardianes de la Galaxia", "Deadpool", "Logan", "X-Men", "Los Vengadores: Era de Ultrón",
            "Avengers: Infinity War", "Avengers: Endgame", "Spider-Man: Sin Camino a Casa", "Batman Inicia", "El Caballero de la Noche Asciende",
            "Guasón", "Venom", "Aquaman", "Mujer Maravilla", "Liga de la Justicia",
            "El Conjuro", "Annabelle", "It: Eso", "El Exorcista", "Actividad Paranormal",
            "La Monja", "La Llorona", "El Aro", "Destino Final", "Siniestro",
            "Son Como Niños", "Mi Pobre Angelito", "Zoolander", "Quiero Matar a mi Jefe", "Superbad",
            "¿Qué Pasó Ayer?", "Una Noche en el Museo", "Señor y Señora Smith", "Loco por Mary",
            "Click: Perdiendo el Control", "Todopoderoso", "Mentiroso, Mentiroso", "Ace Ventura", "La Máscara",
            "Náufrago", "Atrápame Si Puedes", "El Náufrago", "El Terminal", "Filadelfia",
            "Sexto Sentido", "El Origen", "Memento", "La Isla Siniestra", "El Club de la Pelea",
            "Seven: Pecados Capitales", "Zodiaco", "Perdida", "El Gran Truco", "Los Infiltrados",
            "Corazón Valiente", "El Pianista", "La Lista de Schindler", "Bastardos Sin Gloria", "Django Sin Cadenas",
            "Había una Vez en Hollywood", "Kill Bill: La Venganza", "Perros de Reserva", "Los Ocho Más Odiosos",
            "El Gran Hotel Budapest", "La La Land: Una Historia de Amor", "Whiplash: Música y Obsesión", "El Cisne Negro", "Birdman",
            "Parásitos", "El Secreto de sus Ojos", "Relatos Salvajes", "Nueve Reinas", "El Clan",
            "Una Mente Brillante", "En Busca de la Felicidad", "El Niño con el Pijama de Rayas", "La Vida es Bella", "Cinema Paradiso",
            "Amélie", "El Gran Pez", "E.T., el Extraterrestre", "Encuentros Cercanos del Tercer Tipo", "Grease: Brillantina",
            "Dirty Dancing: Baile Caliente", "Footloose", "Fiebre de Sábado por la Noche", "Cantando bajo la Lluvia", "El Mago de Oz",
            "Casablanca", "Ciudadano Kane", "Psicosis", "Los Pájaros", "La Ventana Indiscreta",
            "Vértigo", "Rebeca", "12 Hombres en Pugna", "Testigo de Cargo", "Con Falda y a lo Loco",
            "El Bueno, el Malo y el Feo", "Por un Puñado de Dólares", "La Muerte tenía un Precio", "Sin Perdón", "Los Imperdonables",
            "Buenos Muchachos", "Casino", "El Irlandés", "Caracortada", "El Padrino Parte II"
        ];

        let gameState = {
            status: 'SETUP', // SETUP, PLAYING, FINISHED
            team1: { name: 'Equipo 1', count: 2, score: 0 },
            team2: { name: 'Equipo 2', count: 2, score: 0 },
            durationMin: 2,
            currentRound: 0,
            totalRounds: 2,
            currentParticipantIdxTeam1: 0,
            currentParticipantIdxTeam2: 0,
            activeTeam: 1, // 1 or 2
            currentMovie: '',
            availableMovies: [],
            timerRunning: false,
            timeLeft: 120,
            winner: null
        };

        function saveState() {
            localStorage.setItem('guess_mobile_state', JSON.stringify(gameState));
        }

        function loadState() {
            const saved = localStorage.getItem('guess_mobile_state');
            if (saved) {
                try { gameState = JSON.parse(saved); } catch(e) {}
            }
        }

        window.onload = function() {
            loadState();
            render();

            setInterval(() => {
                if (gameState.status === 'PLAYING' && gameState.timerRunning) {
                    if (gameState.timeLeft > 0) {
                        gameState.timeLeft--;
                        saveState();
                        updateGameTimerDisplay();
                    } else {
                        finishTurn(0);
                    }
                }
            }, 1000);
        };

        function render() {
            const app = document.getElementById('app');
            if (gameState.status === 'SETUP') {
                app.innerHTML = renderSetupView();
            } else if (gameState.status === 'PLAYING') {
                app.innerHTML = renderPlayingView();
            } else if (gameState.status === 'FINISHED') {
                app.innerHTML = renderFinishedView();
            }
        }

        function renderSetupView() {
            return `
                <div class="h-full flex flex-col bg-slate-900 p-6 overflow-y-auto hide-scrollbar">
                    <div class="text-center mb-6 mt-2">
                        <div class="inline-block bg-teal-500/20 text-teal-300 px-4 py-1 rounded-full text-xs font-bold uppercase tracking-widest mb-2 border border-teal-500/30">Juego de Charadas</div>
                        <h1 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-teal-400 to-indigo-400">Guess-Guess</h1>
                        <p class="text-xs text-slate-400 mt-1">Configura la partida para comenzar a jugar</p>
                    </div>

                    <form onsubmit="handleSetupSubmit(event)" class="space-y-5 pb-8 flex-1 flex flex-col justify-between">
                        <div class="space-y-4">
                            <!-- Equipo 1 -->
                            <div class="bg-slate-800/80 p-4 rounded-2xl border border-blue-500/30 shadow-lg space-y-3">
                                <h2 class="text-base font-bold text-blue-400 flex items-center gap-2"><span>🛡️</span> Equipo 1</h2>
                                <div>
                                    <label class="block text-[11px] font-semibold uppercase text-slate-300 mb-1">Cantidad de Participantes</label>
                                    <input type="number" id="t1-count" min="1" max="20" value="${gameState.team1.count}" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white text-base focus:outline-none focus:border-blue-500 font-bold">
                                </div>
                            </div>

                            <!-- Equipo 2 -->
                            <div class="bg-slate-800/80 p-4 rounded-2xl border border-rose-500/30 shadow-lg space-y-3">
                                <h2 class="text-base font-bold text-rose-400 flex items-center gap-2"><span>🔥</span> Equipo 2</h2>
                                <div>
                                    <label class="block text-[11px] font-semibold uppercase text-slate-300 mb-1">Cantidad de Participantes</label>
                                    <input type="number" id="t2-count" min="1" max="20" value="${gameState.team2.count}" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white text-base focus:outline-none focus:border-rose-500 font-bold">
                                </div>
                            </div>

                            <!-- Duración Turno -->
                            <div class="bg-slate-800/80 p-4 rounded-2xl border border-slate-700 shadow-lg">
                                <div class="flex justify-between items-center mb-2">
                                    <label class="text-[11px] font-semibold uppercase text-slate-300">Duración por Turno</label>
                                    <span class="text-indigo-400 font-bold text-sm"><span id="dur-val">${gameState.durationMin}</span> min</span>
                                </div>
                                <input type="range" id="duration-range" min="1" max="10" value="${gameState.durationMin}" oninput="document.getElementById('dur-val').innerText=this.value" class="w-full accent-indigo-500 cursor-pointer h-2 bg-slate-900 rounded-lg">
                                <div class="flex justify-between text-[10px] text-slate-400 mt-1">
                                    <span>1 min</span>
                                    <span>10 min</span>
                                </div>
                            </div>
                        </div>

                        <button type="submit" class="w-full bg-gradient-to-r from-teal-500 to-indigo-600 hover:from-teal-400 hover:to-indigo-500 text-white font-black py-4 rounded-2xl shadow-xl text-base uppercase tracking-wider transition transform active:scale-95">Comenzar Partida</button>
                    </form>
                </div>
            `;
        }

        function handleSetupSubmit(event) {
            event.preventDefault();
            gameState.team1.count = parseInt(document.getElementById('t1-count').value);
            gameState.team2.count = parseInt(document.getElementById('t2-count').value);
            gameState.durationMin = parseInt(document.getElementById('duration-range').value);

            gameState.totalRounds = Math.max(gameState.team1.count, gameState.team2.count);
            gameState.currentRound = 0;
            gameState.team1.score = 0;
            gameState.team2.score = 0;
            gameState.currentParticipantIdxTeam1 = 0;
            gameState.currentParticipantIdxTeam2 = 0;

            // Determinar equipo inicial
            if (gameState.team1.count > gameState.team2.count) {
                gameState.activeTeam = 1;
            } else if (gameState.team2.count > gameState.team1.count) {
                gameState.activeTeam = 2;
            } else {
                gameState.activeTeam = Math.random() < 0.5 ? 1 : 2;
            }

            // Copiar y barajar películas sin repetición en la partida
            gameState.availableMovies = [...MOVIES_DB].sort(() => Math.random() - 0.5);

            gameState.status = 'PLAYING';
            gameState.timeLeft = gameState.durationMin * 60;
            gameState.timerRunning = false;
            pickNewMovie();

            saveState();
            render();
        }

        function pickNewMovie() {
            if (gameState.availableMovies.length === 0) {
                gameState.availableMovies = [...MOVIES_DB].sort(() => Math.random() - 0.5);
            }
            gameState.currentMovie = gameState.availableMovies.pop();
        }

        function renderPlayingView() {
            const activeTeamName = gameState.activeTeam === 1 ? gameState.team1.name : gameState.team2.name;
            const activeBorderColor = gameState.activeTeam === 1 ? 'border-blue-500/50 bg-blue-950/20' : 'border-rose-500/50 bg-rose-950/20';

            return `
                <div class="h-full flex flex-col bg-slate-900 justify-between">
                    <!-- Panel Superior Fijo con Puntajes -->
                    <div class="bg-slate-950 px-4 py-3 border-b border-slate-800 flex justify-between items-center shadow-md">
                        <div class="flex items-center gap-2 ${gameState.activeTeam === 1 ? 'scale-105 font-black text-blue-400' : 'text-slate-400'} transition-all">
                            <span class="w-3 h-3 rounded-full bg-blue-500 inline-block"></span>
                            <span class="text-sm">Equipo 1: <strong class="text-lg text-white">${gameState.team1.score}</strong></span>
                        </div>
                        <div class="text-xs font-semibold px-2.5 py-1 bg-slate-800 rounded-full text-slate-300">
                            Ronda ${gameState.currentRound + 1}/${gameState.totalRounds}
                        </div>
                        <div class="flex items-center gap-2 ${gameState.activeTeam === 2 ? 'scale-105 font-black text-rose-400' : 'text-slate-400'} transition-all">
                            <span class="text-sm">Equipo 2: <strong class="text-lg text-white">${gameState.team2.score}</strong></span>
                            <span class="w-3 h-3 rounded-full bg-rose-500 inline-block"></span>
                        </div>
                    </div>

                    <!-- Contenido Central del Turno -->
                    <div class="flex-1 p-5 flex flex-col justify-around overflow-y-auto">
                        <div class="text-center space-y-2">
                            <span class="text-[11px] font-bold uppercase tracking-widest text-indigo-400 bg-indigo-950/60 px-3 py-1 rounded-full border border-indigo-500/30">Turno Actual</span>
                            <h2 class="text-3xl font-extrabold text-white">Es el turno del <br><span class="${gameState.activeTeam === 1 ? 'text-blue-400' : 'text-rose-400'}">${activeTeamName}</span></h2>
                        </div>

                        <!-- Botón Mostrar Película -->
                        <div class="my-3">
                            <button id="movie-btn" 
                                onmousedown="revealMovie(true)" onmouseup="revealMovie(false)" ontouchstart="revealMovie(true)" ontouchend="revealMovie(false)"
                                class="w-full bg-slate-800/90 hover:bg-slate-800 border-2 border-dashed border-teal-500/80 p-5 rounded-2xl text-center shadow-xl transition select-none flex flex-col items-center justify-center gap-2 active:bg-slate-700">
                                <span class="text-2xl">👁️️</span>
                                <span id="movie-display-text" class="text-base font-black tracking-wide text-teal-300">Mantén presionado para ver película</span>
                            </button>
                            <p class="text-[10px] text-center text-slate-500 mt-1.5">La película se oculta al soltar el botón para evitar trampas.</p>
                        </div>

                        <!-- Panel de Temporizador y Controles -->
                        <div class="bg-slate-800/60 border ${activeBorderColor} rounded-2xl p-4 text-center shadow-lg space-y-3">
                            <div class="text-[11px] font-bold uppercase tracking-wider text-slate-400">Tiempo Restante</div>
                            <div class="text-5xl font-black font-mono text-white tracking-tighter">${formatTime(gameState.timeLeft)}</div>

                            <div>
                                ${!gameState.timerRunning ? `
                                    <button onclick="startTurnTimer()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-black py-3.5 rounded-xl shadow-lg text-base uppercase tracking-wider transition transform active:scale-95">Comenzar Turno</button>
                                ` : `
                                    <button onclick="finishTurnManually()" class="w-full bg-rose-600 hover:bg-rose-500 text-white font-black py-3.5 rounded-xl shadow-lg text-base uppercase tracking-wider animate-pulse transition transform active:scale-95">¡Basta!</button>
                                `}
                            </div>
                        </div>
                    </div>

                    <!-- Botón Reiniciar Configuración -->
                    <div class="p-3 bg-slate-950/50 text-center border-t border-slate-800">
                        <button onclick="resetGameToSetup()" class="text-xs text-slate-400 hover:text-white underline font-medium">Reiniciar Configuración de Partida</button>
                    </div>
                </div>
            `;
        }

        function revealMovie(show) {
            const textEl = document.getElementById('movie-display-text');
            if (textEl) {
                if (show) {
                    textEl.innerText = gameState.currentMovie;
                    textEl.classList.add('text-amber-300', 'scale-105');
                } else {
                    textEl.innerText = "Mantén presionado para ver película";
                    textEl.classList.remove('text-amber-300', 'scale-105');
                }
            }
        }

        function updateGameTimerDisplay() {
            render();
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function startTurnTimer() {
            gameState.timerRunning = true;
            saveState();
            render();
        }

        function finishTurnManually() {
            const remainingSecs = gameState.timeLeft;
            finishTurn(remainingSecs);
        }

        function finishTurn(pointsEarned) {
            gameState.timerRunning = false;

            if (gameState.activeTeam === 1) {
                gameState.team1.score += pointsEarned;
                gameState.currentParticipantIdxTeam1++;
            } else {
                gameState.team2.score += pointsEarned;
                gameState.currentParticipantIdxTeam2++;
            }

            const t1Done = gameState.currentParticipantIdxTeam1 >= gameState.team1.count;
            const t2Done = gameState.currentParticipantIdxTeam2 >= gameState.team2.count;

            if (t1Done && t2Done) {
                gameState.status = 'FINISHED';
                if (gameState.team1.score > gameState.team2.score) {
                    gameState.winner = 1;
                } else if (gameState.team2.score > gameState.team1.score) {
                    gameState.winner = 2;
                } else {
                    gameState.winner = 1; // Empate predeterminado
                }
            } else {
                if (gameState.activeTeam === 1 && !t2Done) {
                    gameState.activeTeam = 2;
                } else if (gameState.activeTeam === 2 && !t1Done) {
                    gameState.activeTeam = 1;
                } else {
                    if (!t1Done) gameState.activeTeam = 1;
                    else if (!t2Done) gameState.activeTeam = 2;
                    else {
                        gameState.status = 'FINISHED';
                        gameState.winner = gameState.team1.score >= gameState.team2.score ? 1 : 2;
                        saveState();
                        render();
                        return;
                    }
                }
                gameState.currentRound++;
                gameState.timeLeft = gameState.durationMin * 60;
                pickNewMovie();
            }

            saveState();
            render();
        }

        function renderFinishedView() {
            const winnerName = gameState.winner === 1 ? gameState.team1.name : gameState.team2.name;
            const winnerScore = gameState.winner === 1 ? gameState.team1.score : gameState.team2.score;

            return `
                <div class="h-full flex flex-col items-center justify-center bg-slate-900 p-6 text-center">
                    <div class="w-24 h-24 rounded-full bg-emerald-500/20 border-4 border-emerald-500 flex items-center justify-center text-5xl mb-6 shadow-xl shadow-emerald-500/30 animate-bounce">🏆</div>
                    <h1 class="text-3xl font-black text-emerald-400 mb-2">¡Partida Terminada!</h1>
                    <p class="text-2xl text-white font-extrabold mb-1">${winnerName}</p>
                    <p class="text-lg text-indigo-300 font-bold mb-6">Felicidades, ¡ustedes ganaron con ${winnerScore} puntos!</p>

                    <div class="w-full bg-slate-800 p-4 rounded-2xl mb-6 space-y-2 border border-slate-700">
                        <div class="flex justify-between text-sm">
                            <span class="text-blue-400 font-bold">Equipo 1 (${gameState.team1.name}):</span>
                            <span class="font-mono font-bold">${gameState.team1.score} pts</span>
                        </div>
                        <div class="flex justify-between text-sm">
                            <span class="text-rose-400 font-bold">Equipo 2 (${gameState.team2.name}):</span>
                            <span class="font-mono font-bold">${gameState.team2.score} pts</span>
                        </div>
                    </div>

                    <button onclick="resetGameToSetup()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-black py-4 rounded-2xl shadow-xl text-base uppercase tracking-wider transition transform active:scale-95">Configurar Nueva Partida</button>
                </div>
            `;
        }

        function resetGameToSetup() {
            gameState.status = 'SETUP';
            gameState.timerRunning = false;
            saveState();
            render();
        }
    </script>
</body>
</html>
